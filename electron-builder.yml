# Packaging: Linux AppImage (x86_64) via `npm run dist`, macOS arm64 ad-hoc .app + .dmg via `npm run dist:mac` (both build `out/` first).
appId: dev.stefanos.openvern
productName: OpenVern
executableName: openvern
copyright: Copyright (c) Stefanos Michelakis
asar: true

directories:
  output: release
  buildResources: build

# Only the built app ships. The main bundle inlines hono, zod, ignore, eventsource-parser… (electron.vite.config.ts)
# and the renderer bundle inlines React etc., so no `node_modules` is packaged at all.
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!node_modules"

electronLanguages:
  - en-US

# D4 (AS-12), both platforms: no env/CLI code injection, and app code loads only from the validated app.asar.
# Cookie encryption is left at the Electron default (enabling it is one-way).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  grantFileProtocolExtraPrivileges: false

mac:
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  identity: "-"
  hardenedRuntime: false
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: OpenVern-${version}-arm64.${ext}
  extendInfo:
    NSDocumentsFolderUsageDescription: OpenVern accesses Documents when you choose projects there.
    NSDesktopFolderUsageDescription: OpenVern accesses Desktop when you choose projects there.
    NSDownloadsFolderUsageDescription: OpenVern accesses Downloads when you choose projects there.

linux:
  artifactName: OpenVern-${version}-x86_64.${ext}
  target:
    - target: AppImage
      arch: x64
  category: Development
  icon: build/icon.png
  synopsis: Chat with LLMs about your local code projects
  # empty: keeps the sandbox-off flag out of the AppImage's built-in .desktop Exec (S8-N2)
  executableArgs: []
  desktop:
    entry:
      StartupWMClass: openvern
