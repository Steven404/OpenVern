# Packaging: Linux AppImage (x86_64) via `npm run dist`, macOS arm64 ad-hoc .app + .dmg via `npm run dist:mac` (both build `out/` first).
appId: dev.stefanos.openvern
productName: OpenVern
executableName: openvern
copyright: Copyright (c) Stefanos Michelakis
# smartUnpack off: by default electron-builder unpacks every file of a package that holds a `.node`, JS included. Only
# the native files listed under asarUnpack leave the asar; the rest stays covered by the asar integrity fuse.
asar:
  smartUnpack: false

directories:
  output: release
  buildResources: build

# Only the built app ships. The main bundle inlines hono, zod, ignore, eventsource-parser… (electron.vite.config.ts)
# and the renderer bundle inlines React etc. The one package taken from node_modules is `node-pty`, which the main
# bundle keeps external because it is native, and only its runtime files: JS, and the binaries for this platform
# (`prebuilds/` on macOS; `build/Release` after a from-source build, which is how Linux gets it: no Linux prebuilds).
# Later patterns win, so the exclusions come after the includes.
files:
  - out/**
  - package.json
  - "!node_modules/**"
  - node_modules/node-pty/package.json
  - node_modules/node-pty/LICENSE
  - node_modules/node-pty/lib/**
  - node_modules/node-pty/prebuilds/${platform}-${arch}/**
  - node_modules/node-pty/build/Release/pty.node
  - node_modules/node-pty/build/Release/spawn-helper
  - "!**/*.map"
  - "!node_modules/node-pty/lib/**/*.test.js"
  # Windows-only code paths; `index.js` loads them only on win32.
  - "!node_modules/node-pty/lib/windows*.js"
  - "!node_modules/node-pty/lib/conpty*.js"
  - "!node_modules/node-pty/lib/shared/**"
  - "!node_modules/node-pty/lib/worker/**"

# What leaves the asar is set per platform below (`mac.asarUnpack`, `linux.asarUnpack`), and kept to the minimum:
# files outside the asar are not covered by the asar integrity fuse.

# node-pty is N-API, so the binary npm installed loads in Electron as is. Without this, electron-builder runs
# @electron/rebuild, which compiles node-pty from source into node_modules (needs a C++ toolchain) and node-pty then
# prefers that build over its prebuilt binary.
npmRebuild: false

electronLanguages:
  - en-US

# D4 (AS-12), both platforms: no env/CLI code injection, and app code loads only from the validated app.asar.
# Cookie encryption is left at the Electron default (enabling it is one-way).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  grantFileProtocolExtraPrivileges: false

mac:
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  # Only `spawn-helper` must be a real file, because it is exec'd (node-pty rewrites its path from `app.asar` to
  # `app.asar.unpacked` itself). `pty.node` stays inside the asar, covered by the integrity check; Electron extracts
  # it to a temp file to load it.
  asarUnpack:
    - node_modules/node-pty/prebuilds/*/spawn-helper
  identity: "-"
  hardenedRuntime: false
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: OpenVern-${version}-arm64.${ext}
  extendInfo:
    NSDocumentsFolderUsageDescription: OpenVern accesses Documents when you choose projects there.
    NSDesktopFolderUsageDescription: OpenVern accesses Desktop when you choose projects there.
    NSDownloadsFolderUsageDescription: OpenVern accesses Downloads when you choose projects there.

linux:
  # Linux has no asar integrity check to keep, and loading `pty.node` from inside the asar would extract it to the
  # temp dir, which fails where /tmp is mounted noexec. So the compiled binary is unpacked here.
  asarUnpack:
    - node_modules/node-pty/build/Release/**
  artifactName: OpenVern-${version}-x86_64.${ext}
  target:
    - target: AppImage
      arch: x64
  category: Development
  icon: build/icon.png
  synopsis: Chat with LLMs about your local code projects
  # empty: keeps the sandbox-off flag out of the AppImage's built-in .desktop Exec (S8-N2)
  executableArgs: []
  desktop:
    entry:
      StartupWMClass: openvern
